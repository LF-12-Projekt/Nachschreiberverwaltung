<div class="exams-header mt-3">
    <h1>Kursname</h1>
</div>

<br/>
<nz-list nzBordered>
    <nz-list-item *ngFor="let exam of exams">
        <span nz-typography>{{ exam.title }}</span>
        <button (click)="openExamEditor(exam.title, exam.date, exam.users)" nz-button nzType="primary">Bearbeiten</button>
    </nz-list-item>
</nz-list>

<div class="create-button">
    <button class="mt-5" (click)="openExamCreator()" nz-button nzType="primary">Nachschreibetermin erstellen</button>
</div>
