<h1 class="mt-3">Willkommen, {{username}}!</h1>

<div nz-row>
    <div nz-col *ngFor="let course of courses" [nzSpan]="8"> <!-- Set the span to control the number of columns -->
        <nz-card (click)="goToExams()" style="width:100%;" [nzTitle]="course" [nzExtra]="extraTemplate">
            <p>Card content</p>
            <p>Card content</p>
            <p>Card content</p>
        </nz-card>
    </div>
</div>

<ng-template #extraTemplate>
    <span class="className">Klassenname</span>
</ng-template>
