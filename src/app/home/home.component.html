<h1 class="mt-3">Willkommen, {{username}}!</h1>

<div nz-row>
    <div nz-col *ngFor="let course of courses" [nzSpan]="8"> <!-- Set the span to control the number of columns -->
        <nz-card (click)="goToExams(course.courseId)" style="width:100%;" [nzTitle]="course.courseName">
            <span class="className">Klasse {{ course.className }}</span>
        </nz-card>
    </div>
</div>
